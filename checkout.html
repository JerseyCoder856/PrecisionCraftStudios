<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<script src="https://www.paypal.com/sdk/js?client-id=AbXrEojdTjfYNt3CrJ4g-UyVEyW-WP5iH-FWpXcCx6Fl6Xoir3sW7Canw8JE_M2cXF5mBYbgmDbV4tva&currency=USD"></script>

  <div id="checkoutItems"></div>
<div id="checkoutTotal"></div>
<div id="paypal-button-container"></div>
  
<style>
body { font-family: Arial; margin:0; padding:0; }
.container { max-width:700px; margin:100px auto; padding:20px; }
.item { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee; }
.total { margin-top:20px; font-size:20px; font-weight:bold; }
.form { margin-top:20px; display:flex; flex-direction:column; gap:10px; }
input, textarea { padding:10px; border:1px solid #ccc; }
</style>
</head>
  
<script src="checkout.js"></script>
  
<body>

<div class="container">

  <h2>Your Cart</h2>
  <div id="checkoutItems"></div>
  <div class="total" id="checkoutTotal"></div>

  <div class="form">
    <input id="name" placeholder="Full Name">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
    <textarea id="address" placeholder="Address"></textarea>
  </div>

  <div id="paypal-button-container" style="margin-top:20px;"></div>

</div>

<script>

window.addEventListener("DOMContentLoaded", () => {

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const itemsContainer = document.getElementById("checkoutItems");
  const totalContainer = document.getElementById("checkoutTotal");

  function getTotal() {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  function render() {

    if (!cart.length) {
      itemsContainer.innerHTML = "<p>Cart is empty</p>";
      totalContainer.innerText = "Total: $0.00";
      return;
    }

    itemsContainer.innerHTML = cart.map(i => `
      <div class="item">
        <span>${i.name} x${i.qty}</span>
        <span>$${(i.price * i.qty).toFixed(2)}</span>
      </div>
    `).join("");

    totalContainer.innerText = "Total: $" + getTotal().toFixed(2);
  }

  function customer() {
    return {
      name: document.getElementById("name").value || "",
      email: document.getElementById("email").value || "",
      phone: document.getElementById("phone").value || "",
      address: document.getElementById("address").value || ""
    };
  }

  function loadPayPal() {

    if (!window.paypal) {
      console.error("PayPal not loaded");
      return;
    }

    paypal.Buttons({

      createOrder: (data, actions) => {
        return actions.order.create({
          purchase_units: [{
            amount: {
              value: getTotal().toFixed(2)
            }
          }]
        });
      },

      onApprove: (data, actions) => {
        return actions.order.capture().then(details => {

          const order = {
            customer: customer(),
            cart: cart,
            payment: details,
            orderId: Date.now()
          };

          localStorage.setItem("lastOrder", JSON.stringify(order));
          localStorage.removeItem("cart");

          window.location.href = "success.html";
        });
      }

    }).render("#paypal-button-container");
  }

  render();
  loadPayPal();

});

</script>

</body>
</html>
