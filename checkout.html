<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout – Precision Craft Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --mint: #8ECAAE;
    --mint-light: #C8E8D9;
    --mint-pale: #EDF7F2;
    --mint-deep: #5FAD8A;
    --white: #FFFFFF;
    --off-white: #F8FCFA;
    --black: #111111;
    --black-soft: #222222;
    --gray: #888888;
    --gray-light: #E8E8E8;
    --font-display: 'Cormorant Garamond', serif;
    --font-ui: 'Jost', sans-serif;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    --shadow: 0 4px 24px rgba(0,0,0,0.07);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-ui); background: var(--off-white); color: var(--black-soft); font-weight: 300; min-height: 100vh; }

  /* ─── NAV ─── */
  nav {
    background: var(--white);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    height: 72px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }
  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .nav-brand { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--black); line-height: 1.05; display: flex; flex-direction: column; }
  .nav-brand span { font-size: 0.62rem; font-family: var(--font-ui); font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gray); margin-top: 1px; }
  .back-link { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--black-soft); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color var(--transition); }
  .back-link:hover { color: var(--mint-deep); }

  /* ─── LAYOUT ─── */
  .checkout-page { max-width: 1100px; margin: 48px auto; padding: 0 24px; display: grid; grid-template-columns: 1fr 420px; gap: 32px; align-items: start; }
  @media (max-width: 800px) { .checkout-page { grid-template-columns: 1fr; } }

  /* ─── PANELS ─── */
  .panel { background: var(--white); border-radius: 6px; box-shadow: var(--shadow); padding: 32px; }
  .panel-title { font-family: var(--font-display); font-size: 1.6rem; font-weight: 400; color: var(--black); margin-bottom: 24px; }
  .panel-title span { color: var(--mint-deep); font-style: italic; }

  /* ─── ORDER SUMMARY ─── */
  .order-item { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--gray-light); }
  .order-item:last-of-type { border-bottom: none; }
  .order-item-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .order-item-img { width: 54px; height: 54px; flex-shrink: 0; border-radius: 4px; background: var(--mint-pale); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .order-item-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .order-item-left { display: flex; flex-direction: column; min-width: 0; }
  .order-item-name { font-size: 0.9rem; font-weight: 500; color: var(--black); }
  .order-item-qty { font-size: 0.78rem; color: var(--gray); margin-top: 2px; }
  .order-item-controls { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .qty-btn { width: 24px; height: 24px; border: 1px solid var(--gray-light); background: var(--white); border-radius: 3px; cursor: pointer; font-size: .95rem; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .qty-btn:hover { border-color: var(--mint); color: var(--mint-deep); }
  .qty-val { min-width: 18px; text-align: center; font-size: .8rem; color: var(--black-soft); }
  .order-item-remove { border: none; background: none; color: var(--gray); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; padding: 0; }
  .order-item-remove:hover { color: #e53e3e; }
  .order-item-price { font-family: var(--font-display); font-size: 1.1rem; font-weight: 600; color: var(--black); }
  .order-divider { height: 1px; background: var(--gray-light); margin: 16px 0; }
  .order-total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .order-total-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--black); }
  .order-total-price { font-family: var(--font-display); font-size: 2rem; font-weight: 600; color: var(--black); }
  .empty-cart-msg { text-align: center; padding: 40px 0; color: var(--gray); font-family: var(--font-display); font-style: italic; font-size: 1rem; }
  .empty-cart-msg a { color: var(--mint-deep); text-decoration: none; font-style: normal; font-family: var(--font-ui); font-size: 0.82rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; display: inline-block; margin-top: 12px; border-bottom: 1px solid var(--mint-deep); }

  /* ─── CUSTOMER FORM ─── */
  .form-group { margin-bottom: 18px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }
  .form-label { display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--black); font-weight: 500; margin-bottom: 8px; }
  .form-input, .form-textarea {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--gray-light); border-radius: 3px;
    font-family: var(--font-ui); font-size: 0.9rem; color: var(--black); background: var(--white);
    outline: none; transition: border-color var(--transition); font-weight: 300;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--mint); }
  .form-textarea { resize: vertical; min-height: 90px; }

  /* ─── PAYPAL AREA ─── */
  .paypal-section { margin-top: 28px; }
  .paypal-label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; color: var(--gray); margin-bottom: 14px; text-align: center; }
  #paypal-button-container { min-height: 50px; }
  .paypal-loading { text-align: center; color: var(--gray); font-size: 0.85rem; padding: 16px; }

  /* ─── SECURE BADGE ─── */
  .secure-badge { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 20px; color: var(--gray); font-size: 0.75rem; letter-spacing: 0.06em; }
  .secure-badge svg { color: var(--mint-deep); }
  .coupon-box { margin: 18px 0 10px; padding: 14px; border: 1px solid var(--gray-light); border-radius: 6px; background: #fcfefd; }
  .coupon-title { font-size: 0.76rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--black); margin-bottom: 10px; }
  .coupon-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .coupon-btn { border: 1.5px solid var(--black); background: var(--black); color: #fff; padding: 0 16px; font-size: 0.76rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; border-radius: 3px; }
  .coupon-msg { margin-top: 8px; font-size: .82rem; color: var(--gray); min-height: 18px; }
  .coupon-msg.success { color: var(--mint-deep); font-weight: 500; }
  .free-checkout-btn { width: 100%; margin-top: 12px; border: 2px solid var(--mint-deep); background: var(--mint-deep); color: #fff; padding: 12px 16px; border-radius: 3px; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .free-checkout-btn:hover { filter: brightness(.95); }
  .free-checkout-btn:disabled { opacity: .6; cursor: not-allowed; }

  @media (max-width: 700px) {
    nav { height: auto; min-height: 72px; flex-wrap: wrap; gap: 10px 14px; padding: 10px 4%; align-items: center; }
    .nav-logo { min-width: 0; flex: 1 1 220px; }
    .nav-logo-img { width: 40px; height: 40px; }
    .nav-brand { font-size: 0.95rem; }
    .nav-brand span { font-size: 0.56rem; letter-spacing: 0.14em; }
    .back-link { font-size: 0.7rem; letter-spacing: 0.08em; }
    .checkout-page { margin: 24px auto; padding: 0 14px; gap: 16px; }
    .panel { padding: 20px; }
    .panel-title { font-size: 1.35rem; margin-bottom: 18px; }
    .order-item { align-items: flex-start; }
    .order-item-price { font-size: 1rem; }
    .coupon-row { grid-template-columns: 1fr; }
    .coupon-btn { min-height: 42px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="https://i.imgur.com/v8Omcnw.png" alt="Precision Craft Studios Logo" class="nav-logo-img">
    <div class="nav-brand">Precision Craft Studios<span>Crafting What Brings Joy</span></div>
  </a>
  <a href="index.html" class="back-link">← Back to Shop</a>
</nav>

<div class="checkout-page">

  <!-- LEFT: Customer Info -->
  <div class="panel">
    <div class="panel-title">Your <span>Details</span></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" id="firstName" class="form-input" placeholder="Jane">
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input type="text" id="lastName" class="form-input" placeholder="Doe">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-input" placeholder="you@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Phone (optional)</label>
      <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 000-0000">
    </div>
    <div class="form-group">
      <label class="form-label">Shipping Address</label>
      <textarea id="address" class="form-textarea" placeholder="123 Main St, City, State, ZIP"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Order Notes (optional)</label>
      <textarea id="notes" class="form-textarea" placeholder="Any special requests, custom design notes, or instructions…" style="min-height:70px;"></textarea>
    </div>
  </div>

  <!-- RIGHT: Order Summary + PayPal -->
  <div>
    <div class="panel">
      <div class="panel-title">Order <span>Summary</span></div>
      <div id="checkoutItems"><div class="paypal-loading">Loading your cart…</div></div>
      <div class="order-divider"></div>
      <div class="order-total-row">
        <span class="order-total-label">Total</span>
        <span class="order-total-price" id="checkoutTotal">$0.00</span>
      </div>


      <div class="coupon-box">
        <div class="coupon-title">Have a discount code?</div>
        <div class="coupon-row">
          <input type="text" id="couponInput" class="form-input" placeholder="Enter code">
          <button type="button" class="coupon-btn" id="applyCouponBtn">Apply</button>
        </div>
        <div class="coupon-msg" id="couponMsg"></div>
      </div>

      <button type="button" id="freeCheckoutBtn" class="free-checkout-btn" style="display:none;">Place Free Order (RAYJAY)</button>
      <div class="paypal-section">
        <div class="paypal-label">Complete your payment securely with PayPal</div>
        <div id="paypal-button-container"><div class="paypal-loading">Loading payment…</div></div>
      </div>

      <div class="secure-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Secured by PayPal
      </div>
    </div>
  </div>

</div>

<!-- PayPal SDK — loaded LAST so DOM is ready -->
<script src="https://www.paypal.com/sdk/js?client-id=AbXrEojdTjfYNt3CrJ4g-UyVEyW-WP5iH-FWpXcCx6Fl6Xoir3sW7Canw8JE_M2cXF5mBYbgmDbV4tva&currency=USD"></script>
<script>
  // ─── Load cart from localStorage ───
  const quantityEnabledProducts = ['Custom Sticker Pack', 'Logo Sticker Pack', "Custom Signature Snapback's"];
  const cart = (JSON.parse(localStorage.getItem('pcs_cart')) || []).map(item =>
    quantityEnabledProducts.includes(item.name) || item.allowQuantity ? item : { ...item, qty: 1, allowQuantity: false }
  );
  localStorage.setItem('pcs_cart', JSON.stringify(cart));

  const FORMSPREE_ENDPOINT = "https://formspree.io/f/xojbenoq";
  const COUPON_CODE = "RAYJAY";
  let discountApplied = false;

  function getSubtotal() {
    return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  }

  function getTotal() {
    return discountApplied ? 0 : getSubtotal();
  }

  function getCustomer() {
    return {
      name: (document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value).trim(),
      email: document.getElementById('email').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      address: document.getElementById('address').value.trim(),
      notes: document.getElementById('notes').value.trim()
    };
  }

  function renderOrderSummary() {
    const container = document.getElementById('checkoutItems');
    const totalEl = document.getElementById('checkoutTotal');

    if (!cart.length) {
      container.innerHTML = `
        <div class="empty-cart-msg">
          Your cart is empty.<br>
          <a href="index.html">← Return to shop</a>
        </div>`;
      totalEl.textContent = '$0.00';
      return false;
    }

    container.innerHTML = cart.map((item, idx) => {
      const imageHTML = item.image
        ? `<img src="${item.image}" alt="${item.name}">`
        : '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8ECAAE" stroke-width="1.5"><circle cx="12" cy="12" r="10"/></svg>';
      const canAdjustQty = quantityEnabledProducts.includes(item.name) || item.allowQuantity;
      const qtyControls = canAdjustQty
        ? `<div class="order-item-controls">
            <button type="button" class="qty-btn" onclick="changeCheckoutQty(${idx}, -1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button type="button" class="qty-btn" onclick="changeCheckoutQty(${idx}, 1)">+</button>
            <button type="button" class="order-item-remove" onclick="removeCheckoutItem(${idx})">Remove</button>
          </div>`
        : `<div class="order-item-controls"><button type="button" class="order-item-remove" onclick="removeCheckoutItem(${idx})">Remove</button></div>`;
      return `
      <div class="order-item">
        <div class="order-item-main">
          <div class="order-item-img">${imageHTML}</div>
          <div class="order-item-left">
            <div class="order-item-name">${item.name}</div>
            <div class="order-item-qty">Qty: ${item.qty}</div>
            ${item.customization ? `<div class="order-item-qty">${item.customization.type || 'Custom'} · ${item.customization.artworkCount || 0} uploaded artwork file(s)</div>` : ''}
            ${qtyControls}
          </div>
        </div>
        <div class="order-item-price">$${(item.price * item.qty).toFixed(2)}</div>
      </div>`;
    }).join('');

const subtotal = getSubtotal();
    const total = getTotal();
    totalEl.textContent = '$' + total.toFixed(2);
    if (discountApplied) { totalEl.textContent += ` (${COUPON_CODE} applied)`; }
    return true;
  }

  function persistCheckoutCart() {
    localStorage.setItem('pcs_cart', JSON.stringify(cart));
  }

  function changeCheckoutQty(idx, delta) {
    if (!cart[idx]) return;
    if (!(quantityEnabledProducts.includes(cart[idx].name) || cart[idx].allowQuantity)) return;
    cart[idx].qty += delta;
    if (cart[idx] && cart[idx].qty <= 0) {
      cart.splice(idx, 1);
    }
    persistCheckoutCart();
    renderOrderSummary();
  }

  function removeCheckoutItem(idx) {
    if (!cart[idx]) return;
    cart.splice(idx, 1);
    persistCheckoutCart();
    renderOrderSummary();
  }

  function setCouponMessage(message, ok = false) {
    const el = document.getElementById('couponMsg');
    el.textContent = message;
    el.classList.toggle('success', ok);
  }

  function updatePaymentVisibility() {
    document.getElementById('paypal-button-container').style.display = discountApplied ? 'none' : 'block';
    document.getElementById('freeCheckoutBtn').style.display = discountApplied ? 'block' : 'none';
  }

  async function postToFormspree(payload) {
    const response = await fetch(FORMSPREE_ENDPOINT, {
      method: 'POST',
      headers: {
        Accept: 'application/json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });
    if (response.ok) return response;
    let details = '';
    try {
      const data = await response.json();
      if (data?.errors?.length) {
        details = data.errors.map(err => err.message || err.code || 'Unknown validation error').join('; ');
      }
    } catch (_) {}
    throw new Error(details || `Submission failed (${response.status})`);
  }

  async function submitOrderToFormspree({ couponCode = '', freeOrder = false, payment = null }) {
    const customer = getCustomer();
    const payload = {
      cart: cart,
      couponCode,
      customer,
      freeOrder,
      subtotal: Number(getSubtotal().toFixed(2)),
      total: Number(getTotal().toFixed(2)),
      payment: payment || {}
    };
    await postToFormspree(payload);
  }

  function applyCoupon() {
    const code = document.getElementById('couponInput').value.trim().toUpperCase();
    if (code === COUPON_CODE) {
      discountApplied = true;
      setCouponMessage(`Coupon applied. Order total is now free. ${COUPON_CODE} can be used unlimited times.`, true);
      renderOrderSummary();
      updatePaymentVisibility();
      return;
    }
    discountApplied = false;
    setCouponMessage('Invalid code.');
    renderOrderSummary();
    updatePaymentVisibility();
  }

  async function submitFreeOrder() {
    if (!cart.length) { alert('Your cart is empty.'); return; }
    const customer = getCustomer();
    if (!customer.email) { alert('Please enter your email address.'); return; }
    const btn = document.getElementById('freeCheckoutBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    try {
      await submitOrderToFormspree({ couponCode: COUPON_CODE, freeOrder: true, payment: { status: 'coupon-bypass' } });
      const order = { orderId: Date.now(), customer, cart, subtotal: getSubtotal().toFixed(2), total: '0.00', couponCode: COUPON_CODE, payment: { status: 'coupon-bypass' } };
      localStorage.setItem('pcs_lastOrder', JSON.stringify(order));
      localStorage.removeItem('pcs_cart');
      window.location.href = 'success.html';
    } catch (err) {
      console.error(err);
      alert('Could not submit free order. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = `Place Free Order (${COUPON_CODE})`;
    }
  }

  function initPayPal() {
    if (typeof paypal === 'undefined') {
      document.getElementById('paypal-button-container').innerHTML =
        '<div class="paypal-loading">Payment unavailable — please refresh the page.</div>';
      return;
    }

    paypal.Buttons({
      style: { layout: 'vertical', color: 'black', shape: 'rect', label: 'pay' },

      createOrder: function(data, actions) {
        const total = getTotal();
        if (total <= 0) {
          alert('Your cart is empty. Please add items before checking out.');
          return Promise.reject('Empty cart');
        }
        return actions.order.create({
          purchase_units: [{
            amount: { value: total.toFixed(2) },
            description: 'Precision Craft Studios Order'
          }]
        });
      },

      onApprove: function(data, actions) {
        return actions.order.capture().then(async function(details) {
          await submitOrderToFormspree({ couponCode: '', freeOrder: false, payment: details });
          const order = {
            orderId: Date.now(),
            customer: getCustomer(),
            cart: cart,
            total: getTotal().toFixed(2),
            payment: details
          };
          localStorage.setItem('pcs_lastOrder', JSON.stringify(order));
          localStorage.removeItem('pcs_cart');
          window.location.href = 'success.html';
        });
      },

      onError: function(err) {
        console.error('PayPal error:', err);
        alert('There was a problem processing your payment. Please try again.');
      }
    }).render('#paypal-button-container');
  }

  // ─── INIT ───
  const hasItems = renderOrderSummary();
  document.getElementById('applyCouponBtn').addEventListener('click', applyCoupon);
  document.getElementById('couponInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyCoupon(); } });
  document.getElementById('couponInput').addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase().replace(/\s+/g, '');
  });
  document.getElementById('freeCheckoutBtn').addEventListener('click', submitFreeOrder);

  if (hasItems) {
    initPayPal();
  } else {
    document.getElementById('paypal-button-container').innerHTML = '';
  }
  updatePaymentVisibility();
</script>

</body>
</html>
