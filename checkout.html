<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout – Precision Craft Studios</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AbXrEojdTjfYNt3CrJ4g-UyVEyW-WP5iH-FWpXcCx6Fl6Xoir3sW7Canw8JE_M2cXF5mBYbgmDbV4tva&currency=USD"></script>

<style>

:root{
  --mint:#8ECAAE;
  --mint-light:#C8E8D9;
  --mint-pale:#EDF7F2;
  --mint-deep:#5FAD8A;
  --white:#fff;
  --off-white:#F8FCFA;
  --black:#111;
  --gray:#888;
  --gray-light:#E8E8E8;

  --font-display:'Cormorant Garamond', serif;
  --font-ui:'Jost', sans-serif;

  --shadow:0 4px 24px rgba(0,0,0,0.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:var(--font-ui);
  background:var(--white);
  color:var(--black);
}

/* NAV */

nav{
  position:fixed;
  top:0;
  width:100%;
  height:72px;
  background:white;
  border-bottom:1px solid rgba(0,0,0,0.06);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.nav-logo{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
}

.nav-logo-img{
  width:54px;
  height:54px;
  border-radius:50%;
  object-fit:cover;
}

.nav-brand{
  font-family:var(--font-display);
  font-size:1.1rem;
  font-weight:600;
  color:var(--black);
  line-height:1.1;
}

.nav-brand span{
  display:block;
  font-size:0.7rem;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:var(--gray);
  font-family:var(--font-ui);
  font-weight:300;
}

/* CHECKOUT */

.checkout-container{
  max-width:760px;
  margin:140px auto 80px;
  padding:40px;
  background:var(--off-white);
  border-radius:20px;
  box-shadow:var(--shadow);
}

.checkout-title{
  font-family:var(--font-display);
  font-size:2.2rem;
  color:var(--mint-deep);
  margin-bottom:30px;
  text-align:center;
}

#checkoutItems{
  margin-bottom:20px;
}

.checkout-item{
  padding:14px 0;
  border-bottom:1px solid var(--gray-light);
  display:flex;
  justify-content:space-between;
}

#checkoutTotal{
  margin-top:20px;
  font-size:1.3rem;
  color:var(--mint-deep);
  text-align:right;
}

/* FORM */

.customer-form{
  margin-top:35px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.customer-form input,
.customer-form textarea{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid var(--gray-light);
  font-family:var(--font-ui);
  font-size:1rem;
}

.customer-form textarea{
  min-height:100px;
  resize:vertical;
}

/* PAYPAL */

#paypal-button-container{
  margin-top:35px;
}

</style>
</head>

<body>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">
    <img 
      src="https://i.imgur.com/v8Omcnw.png" 
      alt="Logo"
      class="nav-logo-img"
    >

    <div class="nav-brand">
      Precision Craft Studios
      <span>Crafting What Brings Joy</span>
    </div>
  </a>
</nav>

<!-- CHECKOUT -->
<section class="checkout-container">

  <div class="checkout-title">
    Your Order
  </div>

  <!-- CART -->
  <div id="checkoutItems"></div>

  <!-- TOTAL -->
  <h3 id="checkoutTotal"></h3>

  <!-- CUSTOMER INFO -->
  <div class="customer-form">

    <input 
      type="text" 
      id="name" 
      placeholder="Full Name"
      required
    >

    <input 
      type="email" 
      id="email" 
      placeholder="Email Address"
      required
    >

    <input 
      type="tel" 
      id="phone" 
      placeholder="Phone Number"
    >

    <textarea 
      id="address" 
      placeholder="Shipping Address"
    ></textarea>

  </div>

  <!-- PAYPAL -->
  <div id="paypal-button-container"></div>

</section>

<script>

/* CART */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

/* ELEMENTS */
const itemsContainer = document.getElementById("checkoutItems");
const totalContainer = document.getElementById("checkoutTotal");

/* TOTAL */
function getTotal(){
  return cart.reduce((sum, item) => {
    return sum + item.price * item.qty;
  }, 0);
}

/* RENDER CART */
function renderCheckout(){

  if(!cart.length){

    itemsContainer.innerHTML = `
      <p>Your cart is empty.</p>
    `;

    totalContainer.innerText = "Total: $0.00";

    return;
  }

  itemsContainer.innerHTML = cart.map(item => `
  
    <div class="checkout-item">
    
      <span>
        ${item.name} x${item.qty}
      </span>

      <span>
        $${(item.price * item.qty).toFixed(2)}
      </span>

    </div>

  `).join("");

  totalContainer.innerText =
    "Total: $" + getTotal().toFixed(2);
}

/* CUSTOMER INFO */
function getCustomerInfo(){

  return {

    name:
      document.getElementById("name").value,

    email:
      document.getElementById("email").value,

    phone:
      document.getElementById("phone").value,

    address:
      document.getElementById("address").value
  };
}

/* PAYPAL */
function loadPayPal(){

  /* STOP EMPTY CART CHECKOUT */
  if(!cart.length){
    return;
  }

  paypal.Buttons({

    createOrder: function(data, actions){

      return actions.order.create({

        purchase_units: [{

          amount: {
            value: getTotal().toFixed(2)
          }

        }]
      });
    },

    onApprove: function(data, actions){

      return actions.order.capture().then(function(details){

        const order = {

          customer: getCustomerInfo(),

          cart: cart,

          payment: details,

          orderId: Date.now()
        };

        /* SAVE ORDER */
        localStorage.setItem(
          "lastOrder",
          JSON.stringify(order)
        );

        /* CLEAR CART */
        localStorage.removeItem("cart");

        /* REDIRECT */
        window.location.href = "success.html";
      });
    },

    onError: function(err){

      console.error(err);

      alert(
        "Payment failed. Please try again."
      );
    }

  }).render("#paypal-button-container");
}

/* INIT */
renderCheckout();
loadPayPal();

</script>

</body>
</html>
